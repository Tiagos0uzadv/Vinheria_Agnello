<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Entre em contato com a Vinheria Angnello.">
    <meta name="keywords" content="contato, Vinheria Angnello, atendimento, vinho">

    <title>Vinheria Angnello | Contato</title>

    <link rel="stylesheet" href="./styles.css">
    <link rel="icon" href="./photos/logosite.png">

</head>

<body>

    <header class="page-header">

        <img src="photos/logositeback.png" alt="Logo Angnello">

        <h1>Entre em contato</h1>

        <p>Estamos à disposição para atender você.</p>

    </header>


    <nav class="menu">

        <a class="menu__brand" href="index.html">
            Angnello
        </a>

        <ul class="menu__links">

            <li><a href="index.html">Início</a></li>
            <li><a href="vinhos.html">Vinhos</a></li>
            <li><a href="historia.html">Nossa história</a></li>
            <li><a href="galeria.html">Galeria</a></li>
            <li><a href="contato.html">Contato</a></li>

        </ul>

    </nav>


    <main>

        <section class="content-box">

            <h2>Fale conosco</h2>

            <form>

                <div class="form-group">

                    <label for="nome">
                        Nome:
                    </label>

                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

                </div>


                <div class="form-group">

                    <label for="email">
                        E-mail:
                    </label>

                    <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                </div>


                <div class="form-group">

                    <label for="mensagem">
                        Mensagem:
                    </label>

                    <textarea id="mensagem" name="mensagem" rows="6" placeholder="Digite sua mensagem" required>
            </textarea>

                </div>


                <button type="submit">
                    Enviar mensagem
                </button>

            </form>

        </section>


        <section class="content-box">

            <h2>Outros contatos</h2>

            <p>
                E-mail: contato@vinheriaagnello.com.br
            </p>

            <p>
                Telefone: (11) 98765-4321
            </p>

        </section>

    </main>


    <footer>

        <p>&copy; 2026 Vinheria Angnello</p>

    </footer>

</body>

</html>
